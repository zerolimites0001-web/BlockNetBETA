<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BlockNet</title>
<link rel="stylesheet" href="./assets/css/style.css">
<link rel="stylesheet" href="./assets/css/hud.css">
<script src="./assets/js/vendor/three.min.js"></script>
</head>
<body>
<div id="game"></div>
<div id="fps">--</div>
<div id="cross"></div>
<div id="dbg" class="hidden"></div>
<div id="menu" class="hidden">
  <h2>Blocos (B fecha)</h2>
  <div id="grid"></div>
</div>
<div id="set" class="hidden">
  <h3>Render</h3>
  <label>Chunks (raio): <b id="vReal">2</b></label>
  <input id="rgReal" type="range" min="1" max="8" value="2">
  <small id="stChunk"></small>
</div>
<div id="hotbar"></div>
<div id="hud">
  <div class="dpad">
    <div class="hole"></div><button data-m="f">▲</button><div class="hole"></div>
    <button data-m="l">◀</button><div class="core"></div><button data-m="r">▶</button>
    <div class="hole"></div><button data-m="b">▼</button><div class="hole"></div>
  </div>
  <div class="acts">
    <div class="minirow"><button id="bCam">CAM</button><button id="bSet">SET</button></div>
    <button id="bJump" aria-label="pular"><svg viewBox="0 0 14 16"><path fill="#fff" d="M7 1 L13 8 L10 8 L10 15 L4 15 L4 8 L1 8 Z"/></svg></button>
    <button id="bSneak" aria-label="esgueirar"><svg viewBox="0 0 14 16"><path fill="#fff" d="M7 15 L1 8 L4 8 L4 1 L10 1 L10 8 L13 8 Z"/></svg></button>
    <button id="bBrk" aria-label="quebrar"><svg viewBox="0 0 16 16"><path fill="#fff" d="M11 1 L13 1 L13 3 L12 4 L12 8 L13 8 L13 10 L12 10 L8 10 L7 10 L7 8 L8 8 L8 4 Z M7 11 L5 13 L3 13 L3 15 L5 15 L9 11 Z"/></svg></button>
    <button id="bPlc" aria-label="colocar"><svg viewBox="0 0 16 16"><path fill="#fff" d="M1 5 L15 5 L15 12 L1 12 Z M1 8 L15 8 M5 5 L5 8 M11 5 L11 8 M8 8 L8 12" stroke="#2b2b2b" stroke-width="1"/></svg></button>
    <button id="bInv" aria-label="blocos"><svg viewBox="0 0 14 14"><path fill="#fff" d="M6 1 L8 1 L8 6 L13 6 L13 8 L8 8 L8 13 L6 13 L6 8 L1 8 L1 6 L6 6 Z"/></svg></button>
  </div>
</div>
<div id="title">
  <h1>BLOCKNET</h1>
  <div id="wlist"></div>
  <div class="row"><input id="wname" placeholder="nome do mundo" maxlength="20"><button class="mcbtn" id="wnew">Criar</button></div>
  <div class="row"><button class="mcbtn big" id="wplay">PLAY</button><button class="mcbtn" id="wdel">Apagar</button></div>
  <small>mundo = seed + suas alterações (IndexedDB)</small>
</div>
<div id="load" style="display:none"><h1>BLOCKNET</h1><p>Recebendo assets... 0%</p><div class="bar"><div class="fill"></div></div><small></small></div>
<script src="./assets/js/LevelNoise.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
