<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BlockNet</title>
<link rel="stylesheet" href="./assets/css/style.css?v=4">
<link rel="stylesheet" href="./assets/css/hud.css?v=4">
<script src="./assets/js/vendor/three.min.js"></script>
<script src="./assets/js/vendor/jszip.min.js"></script>
<script src="./assets/js/vendor/fflate.min.js"></script>
<script src="./assets/js/vendor/OBJLoader.js"></script>
<script src="./assets/js/vendor/FBXLoader.js"></script>
<script src="./assets/js/vendor/GLTFLoader.js"></script>
</head>
<body>
<div id="game"></div>
<div id="fps">--</div>
<div id="cross"></div>
<div id="dbg" class="hidden"></div>
<div id="pause" class="hidden">
  <h2>PAUSADO</h2>
  <button class="mcbtn big" id="pBack">Voltar ao jogo</button>
  <button class="mcbtn" id="pSave">Salvar mundo</button>
  <button class="mcbtn" id="pExit">Salvar e sair</button>
</div>
<div id="menu" class="hidden">
  <div id="sheet">
    <div id="grab"></div>
    <div id="sheetHead"><b>Inventário</b><button id="mClose">✕</button></div>
    <input id="mSearch" placeholder="🔍 buscar bloco..." autocomplete="off">
    <div id="mTabs"></div>
    <div id="mHot"></div>
    <div id="mPal"></div>
    <small id="mHint">toque no bloco, depois no slot • arraste a alça p/ fechar</small>
  </div>
</div>
<div id="set" class="hidden">
  <h3>Render</h3>
  <label>Chunks (raio): <b id="vReal">2</b></label>
  <input id="rgReal" type="range" min="1" max="16" value="2">
  <small id="stChunk"></small>
</div>
<div id="hotbar"></div>
<button id="bPause" aria-label="pausa">II</button>
<div id="hud">
  <div class="dpad">
    <div class="hole"></div><button data-m="f">▲</button><div class="hole"></div>
    <button data-m="l">◀</button><div class="core"></div><button data-m="r">▶</button>
    <div class="hole"></div><button data-m="b">▼</button><div class="hole"></div>
  </div>
  <div class="acts">
    <div class="minirow"><button id="bCam">CAM</button><button id="bSet">SET</button></div>
    <button id="bJump" aria-label="pular"><svg viewBox="0 0 14 16"><path fill="#fff" d="M7 1 L13 8 L10 8 L10 15 L4 15 L4 8 L1 8 Z"/></svg></button>
    <button id="bSneak" aria-label="esgueirar"><svg viewBox="0 0 14 16"><path fill="#fff" d="M7 15 L1 8 L4 8 L4 1 L10 1 L10 8 L13 8 Z"/></svg></button>
    <button id="bBrk" aria-label="quebrar"><svg viewBox="0 0 16 16"><path fill="#fff" d="M11 1 L13 1 L13 3 L12 4 L12 8 L13 8 L13 10 L12 10 L8 10 L7 10 L7 8 L8 8 L8 4 Z M7 11 L5 13 L3 13 L3 15 L5 15 L9 11 Z"/></svg></button>
    <button id="bPlc" aria-label="colocar"><svg viewBox="0 0 16 16"><path fill="#fff" d="M1 5 L15 5 L15 12 L1 12 Z M1 8 L15 8 M5 5 L5 8 M11 5 L11 8 M8 8 L8 12" stroke="#2b2b2b" stroke-width="1"/></svg></button>
    <button id="bInv" aria-label="blocos"><svg viewBox="0 0 14 14"><path fill="#fff" d="M6 1 L8 1 L8 6 L13 6 L13 8 L8 8 L8 13 L6 13 L6 8 L1 8 L1 6 L6 6 Z"/></svg></button>
  </div>
</div>
<div id="title">
  <h1>BLOCKNET</h1>
  <div id="wlist"></div>
  <div class="row"><input id="wname" placeholder="nome do mundo" maxlength="20"><button class="mcbtn" id="wnew">Criar</button></div>
  <div class="row"><button class="mcbtn big" id="wplay">PLAY</button><button class="mcbtn" id="wdel">Apagar</button></div>
  <div class="row"><a class="mcbtn" id="wset" href="./settings.html">SETTINGS</a><button class="mcbtn" id="wshad">SHADERS</button><button class="mcbtn" id="wmods">MODS</button></div>
  <input type="file" id="zipImp" accept=".zip,application/zip" style="display:none">
  <div id="modpanel" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;display:none;align-items:center;justify-content:center">
    <div style="background:#1a1a1a;border:3px solid #555;max-width:420px;width:92%;max-height:80vh;overflow:auto;padding:12px;font-family:monospace;color:#fff">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>MODS</b><button class="mcbtn" id="modclose" style="flex:0;padding:4px 10px">X</button></div>
      <button class="mcbtn big" id="modimport" style="width:100%;margin-bottom:10px">+ IMPORTAR .ZIP</button>
      <div id="modlist"></div>
    </div>
  </div>
  <input type="file" id="modImp" accept=".zip,application/zip" style="display:none">
  <div id="shpanel" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;display:none;align-items:center;justify-content:center">
    <div style="background:#1a1a1a;border:3px solid #555;max-width:420px;width:92%;max-height:80vh;overflow:auto;padding:12px;font-family:monospace;color:#fff">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>SHADERS</b><button class="mcbtn" id="shclose" style="flex:0;padding:4px 10px">X</button></div>
      <button class="mcbtn big" id="shimport" style="width:100%;margin-bottom:10px">+ IMPORTAR .ZIP</button>
      <div id="shlist"></div>
    </div>
  </div>
  <small>mundo = seed + suas alterações (IndexedDB)</small>
  <div class="row"><button class="mcbtn" id="wDestroy" style="background:#a00">DESTROY DATA</button><button class="mcbtn" id="wLog">LOG</button></div>
<div id="logpanel" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;align-items:center;justify-content:center">
<div style="background:#0a0a0a;border:3px solid #555;max-width:480px;width:94%;max-height:82vh;overflow:auto;padding:10px;font-family:monospace;color:#0f0;font-size:11px">
<div style="display:flex;gap:6px;margin-bottom:8px"><button class="mcbtn" id="logCopy" style="flex:1">COPIAR</button><button class="mcbtn" id="logClose" style="flex:0;padding:4px 12px">X</button></div>
<pre id="logBody" style="white-space:pre-wrap;word-break:break-all;margin:0"></pre>
</div>
</div>
</div>
<div id="load" style="display:none"><h1>BLOCKNET</h1><p>Recebendo assets... 0%</p><div class="bar"><div class="fill"></div></div><small></small></div>
<script>
window.__LOGBUF=[];
window.__log=function(m){try{var t=new Date().toISOString().slice(11,19);window.__LOGBUF.push('['+t+'] '+m);if(window.__LOGBUF.length>300)window.__LOGBUF.shift();}catch(e){}};
addEventListener('error',function(e){window.__log('ERR '+((e&&e.message)||e)+' @'+((e&&e.filename)||''));});
addEventListener('unhandledrejection',function(e){window.__log('REJ '+((e.reason&&e.reason.message)||e.reason));});
</script>
<script src="./assets/js/shaders.js?v=7"></script>
<script src="./assets/js/mods.js?v=9"></script>
<script src="./assets/js/app.js?v=37"></script>
</body>
</html>
