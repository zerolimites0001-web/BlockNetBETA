<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BlockNet</title>
<link rel="stylesheet" href="./assets/css/style.css">
<link rel="stylesheet" href="./assets/css/hud.css">
<script src="./assets/js/vendor/three.min.js"></script>
</head>
<body>
<div id="game"></div>
<div id="fps">--</div>
<div id="cross"></div>
<div id="dbg" class="hidden"></div>
<div id="menu" class="hidden">
  <h2>Blocos (B fecha)</h2>
  <div id="grid"></div>
</div>
<div id="set" class="hidden">
  <h3>Render</h3>
  <label>Chunks (raio): <b id="vReal">2</b></label>
  <input id="rgReal" type="range" min="1" max="8" value="2">
  <small id="stChunk"></small>
</div>
<div id="hotbar"></div>
<div id="hud">
  <div class="dpad">
    <div></div><button data-m="f">▲</button><div></div>
    <button data-m="l">◀</button><button data-m="b">▼</button><button data-m="r">▶</button>
  </div>
  <div class="btns">
    <button id="bJump">JMP</button>
    <button id="bBrk">BRK</button>
    <button id="bPlc">PLC</button>
    <button id="bInv">INV</button>
    <button id="bCam">CAM</button>
    <button id="bSet">SET</button>
  </div>
</div>
<div id="title">
  <h1>BLOCKNET</h1>
  <div id="wlist"></div>
  <div class="row"><input id="wname" placeholder="nome do mundo" maxlength="20"><button class="mcbtn" id="wnew">Criar</button></div>
  <div class="row"><button class="mcbtn big" id="wplay">PLAY</button><button class="mcbtn" id="wdel">Apagar</button></div>
  <small>mundo = seed + suas alterações (IndexedDB)</small>
</div>
<div id="load" style="display:none"><h1>BLOCKNET</h1><p>Recebendo assets... 0%</p><div class="bar"><div class="fill"></div></div><small></small></div>
<script src="./assets/js/LevelNoise.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
